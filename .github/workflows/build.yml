name: M64Plus Quest

# Upstream also published a rolling "Pre-release" tag from here on every push to master. That job
# pushed a tag with the workflow token, which this repository does not allow, so it failed on every
# build; releases here are cut by hand and versioned, so it is gone rather than fixed.
on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386
        packages: 'platform-tools'

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Set up environment variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

    - name: Checkout mupen64plus-ae repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Decode debug keystore
      env:
        DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
      run: |
        if [ -z "$DEBUG_KEYSTORE" ]
        then
           echo "No debug keystore value"
        else
           echo $DEBUG_KEYSTORE > debug.keystore.base64
           base64 --decode debug.keystore.base64 > debug.keystore
           sudo cp -f debug.keystore $HOME/.android/.
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends file gawk

    - name: Build artifact
      run: ./gradlew assemble

    - name: Declare branch name
      id: branch-name
      uses: tj-actions/branch-names@v8

    - name: Get branch name
      id: var
      run: |
        echo "branch=${{ steps.branch-name.outputs.current_branch }}" >> $GITHUB_OUTPUT

    - name: Declare sha name
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
      with:
        length: 7

    - name: Get sha name
      run: |
        echo $SHA
      env:
        SHA: ${{ steps.short-sha.outputs.sha }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mupen64plus-ae-${{ steps.var.outputs.branch }}-${{ env.SHA }}
        path: ${{ github.workspace }}/app/build/outputs/apk/release/Mupen64PlusAE-release.apk
